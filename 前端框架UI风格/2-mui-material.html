<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Material UI 风格 Demo</title>
<style>
:root{--p:#1976d2;--pd:#1565c0;--s:#9c27b0;--ok:#2e7d32;--er:#d32f2f;--wa:#ed6c02;--tx:rgba(0,0,0,.87);--tx2:rgba(0,0,0,.6);--dv:rgba(0,0,0,.12)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#fafafa;color:var(--tx);font:400 1rem/1.5 Roboto,Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:.00938em}
.e1{box-shadow:0 2px 1px -1px rgba(0,0,0,.2),0 1px 1px 0 rgba(0,0,0,.14),0 1px 3px 0 rgba(0,0,0,.12)}
.e4{box-shadow:0 2px 4px -1px rgba(0,0,0,.2),0 4px 5px 0 rgba(0,0,0,.14),0 1px 10px 0 rgba(0,0,0,.12)}
.e24{box-shadow:0 11px 15px -7px rgba(0,0,0,.2),0 24px 38px 3px rgba(0,0,0,.14),0 9px 46px 8px rgba(0,0,0,.12)}
/* AppBar */
.appbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:16px;height:64px;padding:0 24px;background:var(--p);color:#fff}
.appbar h1{flex:1;margin:0;font-size:1.25rem;font-weight:500;letter-spacing:.0075em}
.icon-btn{position:relative;overflow:hidden;width:40px;height:40px;border:none;border-radius:50%;background:none;color:inherit;font-size:20px;cursor:pointer}
.icon-btn:hover{background:rgba(255,255,255,.12)}
.container{max-width:1000px;margin:0 auto;padding:32px 24px}
h2{font-size:1.5rem;font-weight:400;margin:32px 0 16px}
h2:first-child{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px}
.paper{background:#fff;border-radius:4px}
/* Button */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:64px;padding:6px 16px;border:0;border-radius:4px;font:500 .875rem/1.75 Roboto,Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:.02857em;text-transform:uppercase;cursor:pointer;transition:background-color .25s,box-shadow .25s;background:none;color:var(--c,var(--p))}
.btn:hover{background:color-mix(in srgb,var(--c,var(--p)) 4%,transparent)}
.btn.contained{background:var(--c,var(--p));color:#fff;box-shadow:0 3px 1px -2px rgba(0,0,0,.2),0 2px 2px 0 rgba(0,0,0,.14),0 1px 5px 0 rgba(0,0,0,.12)}
.btn.contained:hover{background:color-mix(in srgb,var(--c,var(--p)) 85%,#000);box-shadow:0 2px 4px -1px rgba(0,0,0,.2),0 4px 5px 0 rgba(0,0,0,.14),0 1px 10px 0 rgba(0,0,0,.12)}
.btn.outlined{border:1px solid color-mix(in srgb,var(--c,var(--p)) 50%,transparent);padding:5px 15px}
.btn.outlined:hover{border-color:var(--c,var(--p))}
.btn.sec{--c:var(--s)}.btn.ok{--c:var(--ok)}.btn.er{--c:var(--er)}.btn.wa{--c:var(--wa)}
.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.3;transform:scale(0);animation:rp .6s ease-out;pointer-events:none}
@keyframes rp{to{transform:scale(1);opacity:0}}
.fab{position:fixed;right:32px;bottom:32px;width:56px;height:56px;border:0;border-radius:50%;background:var(--s);color:#fff;font-size:26px;cursor:pointer;overflow:hidden}
.fab:hover{background:#7b1fa2}
/* TextField */
.tf{position:relative;margin-top:8px}
.tf input{width:100%;height:56px;padding:16.5px 14px;border:1px solid rgba(0,0,0,.23);border-radius:4px;font:inherit;color:var(--tx);background:#fff;outline:none;transition:border-color .2s}
.tf input:hover{border-color:var(--tx)}
.tf input:focus{border:2px solid var(--p);padding:15.5px 13px}
.tf label{position:absolute;left:14px;top:16px;padding:0 5px;margin-left:-5px;color:var(--tx2);background:#fff;pointer-events:none;transition:.2s;transform-origin:left}
.tf input:focus+label,.tf input:not(:placeholder-shown)+label{top:-10px;transform:scale(.75);background:#fff}
.tf input:focus+label{color:var(--p)}
/* Chip */
.chip{display:inline-flex;align-items:center;height:32px;padding:0 12px;border-radius:16px;font-size:.8125rem;background:rgba(0,0,0,.08);color:var(--tx);gap:6px}
.chip.fill{background:var(--c);color:#fff}
.chip.out{background:none;border:1px solid var(--c);color:var(--c)}
.chip button{border:0;background:rgba(0,0,0,.26);color:#fff;width:18px;height:18px;border-radius:50%;font-size:12px;line-height:1;cursor:pointer;padding:0}
/* Switch */
.sw{display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.sw input{display:none}
.sw .tr{position:relative;width:58px;height:38px;padding:12px}
.sw .tr::before{content:"";display:block;width:34px;height:14px;border-radius:7px;background:#000;opacity:.38;transition:.15s}
.sw .tr::after{content:"";position:absolute;top:9px;left:9px;width:20px;height:20px;border-radius:50%;background:#fafafa;transition:.15s;box-shadow:0 2px 1px -1px rgba(0,0,0,.2),0 1px 1px 0 rgba(0,0,0,.14),0 1px 3px 0 rgba(0,0,0,.12)}
.sw input:checked+.tr::before{background:var(--p);opacity:.5}
.sw input:checked+.tr::after{background:var(--p);transform:translateX(20px)}
/* Tabs */
.tabs{display:flex;border-bottom:1px solid var(--dv);position:relative}
.tab{padding:12px 16px;min-width:90px;border:0;background:none;font:500 .875rem Roboto,Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;text-transform:uppercase;color:var(--tx2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:.2s}
.tab.on{color:var(--p);border-color:var(--p)}
/* Card */
.card-h{display:flex;align-items:center;gap:16px;padding:16px}
.av{width:40px;height:40px;border-radius:50%;background:var(--s);color:#fff;display:grid;place-items:center;font-weight:500}
.card-h b{display:block;font-weight:400}.card-h small{color:var(--tx2);font-size:.875rem}
.card-c{padding:0 16px 16px;color:var(--tx2);font-size:.875rem}
.card-a{padding:8px}
.stat{padding:16px 24px}.stat small{color:var(--tx2)}.stat div{font-size:2.125rem;font-weight:400;line-height:1.2;margin-top:4px}
/* Table */
table{width:100%;border-collapse:collapse}
th{padding:16px;text-align:left;font-weight:500;font-size:.875rem;border-bottom:1px solid #e0e0e0}
td{padding:16px;font-size:.875rem;border-bottom:1px solid #e0e0e0}
tbody tr:hover{background:rgba(0,0,0,.04)}
td.r,th.r{text-align:right}
/* Dialog / Snackbar */
.back{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:20}
.back.show{display:flex}
.dlg{width:440px;max-width:92vw;background:#fff;border-radius:4px;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:scale(.9)}}
.dlg h3{margin:0;padding:16px 24px;font-size:1.25rem;font-weight:500}
.dlg .c{padding:8px 24px 20px;display:grid;gap:16px}
.dlg .a{padding:8px;display:flex;justify-content:flex-end;gap:8px}
#sb{position:fixed;left:24px;bottom:24px;z-index:30;display:flex;flex-direction:column;gap:8px}
.snack{min-width:288px;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:6px 16px;border-radius:4px;background:#323232;color:#fff;font-size:.875rem;animation:fade .2s;box-shadow:0 3px 5px -1px rgba(0,0,0,.2),0 6px 10px 0 rgba(0,0,0,.14),0 1px 18px 0 rgba(0,0,0,.12)}
</style>
</head>
<body>
<div class="appbar e4">
  <button class="icon-btn">☰</button>
  <h1>Material 订单中心</h1>
  <button class="btn" style="color:#fff">登录</button>
  <button class="icon-btn">🔔</button>
</div>

<div class="container">
  <h2>统计 Cards</h2>
  <div class="grid">
    <div class="paper e1 stat"><small>本月订单</small><div>1,284</div></div>
    <div class="paper e1 stat"><small>销售额 (元)</small><div>¥ 386,420</div></div>
    <div class="paper e1">
      <div class="card-h"><div class="av">林</div><div><b>林小雨</b><small>2026 年 10 月 13 日</small></div></div>
      <div class="card-c">今日已处理 36 笔订单，其中 4 笔需要人工复核。</div>
      <div class="card-a"><button class="btn">查看</button><button class="btn sec">分享</button></div>
    </div>
  </div>

  <h2>按钮 Buttons</h2>
  <div class="paper e1" style="padding:24px;display:grid;gap:16px">
    <div style="display:flex;flex-wrap:wrap;gap:16px">
      <button class="btn">Text</button><button class="btn contained">Contained</button><button class="btn outlined">Outlined</button>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:16px">
      <button class="btn contained sec">Secondary</button><button class="btn contained ok">Success</button><button class="btn contained wa">Warning</button><button class="btn contained er">Error</button>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">
      <span class="chip">默认</span><span class="chip fill" style="--c:var(--p)">Primary</span><span class="chip out" style="--c:var(--s)">Outlined</span>
      <span class="chip" id="chip">可删除 <button onclick="this.parentNode.remove();snack('Chip 已删除')">✕</button></span>
      <label class="sw"><input type="checkbox" checked onchange="snack(this.checked?'通知已开启':'通知已关闭')"><span class="tr"></span>邮件通知</label>
    </div>
  </div>

  <h2>订单 Table</h2>
  <div class="paper e1">
    <div class="tabs" id="tabs">
      <button class="tab on" data-f="">全部</button><button class="tab" data-f="已完成">已完成</button><button class="tab" data-f="处理中">处理中</button><button class="tab" data-f="待付款">待付款</button>
    </div>
    <table>
      <thead><tr><th>订单号</th><th>客户</th><th>状态</th><th class="r">金额</th><th class="r">操作</th></tr></thead>
      <tbody id="tb"></tbody>
    </table>
  </div>
</div>

<button class="fab e4" onclick="openD()" title="新增订单">＋</button>

<div class="back" id="dlg" onclick="if(event.target===this)closeD()">
  <div class="dlg e24">
    <h3>新增订单</h3>
    <div class="c">
      <div class="tf" style="margin-top:8px"><input id="f-c" placeholder=" "><label>客户名称</label></div>
      <div class="tf"><input id="f-a" type="number" placeholder=" "><label>订单金额</label></div>
    </div>
    <div class="a"><button class="btn" onclick="closeD()">取消</button><button class="btn" onclick="add()">保存</button></div>
  </div>
</div>
<div id="sb"></div>

<script>
const $=id=>document.getElementById(id);
const col={已完成:'var(--ok)',处理中:'var(--p)',待付款:'var(--wa)'};
let rows=[['SO-20261001','瑞丰科技','已完成',12800],['SO-20261002','海港贸易','处理中',8450],['SO-20261003','南岭制造','待付款',23600],['SO-20261004','晨光电子','已完成',5980],['SO-20261005','云帆物流','处理中',17200]];
let flt='';
function render(){
  $('tb').innerHTML=rows.map((r,i)=>({r,i})).filter(o=>!flt||o.r[2]===flt).map(({r,i})=>
   `<tr><td>${r[0]}</td><td>${r[1]}</td><td><span class="chip out" style="--c:${col[r[2]]};height:24px">${r[2]}</span></td>
    <td class="r">¥ ${r[3].toLocaleString()}</td><td class="r"><button class="btn er" onclick="del(${i})">删除</button></td></tr>`).join('');
}
function del(i){const r=rows.splice(i,1)[0];render();snack('已删除 '+r[0],()=>{rows.splice(i,0,r);render()})}
function openD(){$('dlg').classList.add('show')}function closeD(){$('dlg').classList.remove('show')}
function add(){
  const c=$('f-c').value.trim(),a=+$('f-a').value;if(!c||!a)return snack('请填写客户名称和金额');
  rows.unshift(['SO-'+(20261006+rows.length),c,'待付款',a]);$('f-c').value=$('f-a').value='';closeD();render();snack('订单已保存');
}
function snack(t,undo){
  const e=document.createElement('div');e.className='snack';e.innerHTML=`<span>${t}</span>`;
  if(typeof undo==='function'){const b=document.createElement('button');b.className='btn';b.style.color='#90caf9';b.textContent='撤销';b.onclick=()=>{undo();e.remove()};e.appendChild(b)}
  $('sb').appendChild(e);setTimeout(()=>e.remove(),3500);
}
$('tabs').onclick=e=>{const t=e.target.closest('.tab');if(!t)return;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');flt=t.dataset.f;render()};
document.addEventListener('pointerdown',e=>{
  const b=e.target.closest('.btn,.icon-btn,.fab');if(!b)return;
  const r=b.getBoundingClientRect(),s=Math.max(r.width,r.height)*2,d=document.createElement('span');
  d.className='ripple';d.style.cssText=`width:${s}px;height:${s}px;left:${e.clientX-r.left-s/2}px;top:${e.clientY-r.top-s/2}px`;
  b.appendChild(d);setTimeout(()=>d.remove(),600);
});
render();
</script>
</body>
</html>
